<!DOCTYPE html>
{% load static %}
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>Home Page</title>
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
    <title>id selector</title>
    home.css
</head>

<body>

    <header class="header">
        <div class="title">YOUR LOGO</div>

        <nav class="nav">
            <a href="#">HOME</a>
            <a href="#">ABOUT</a>
            <a href="#">SERVICE</a>
            <a href="#">CONTACT</a>
        </nav>
    </header>

    <main class="main">
        <h1>Explore THE WORLD</h1>

        <p>
           American Dream
        </p>

        <button class="btn">GET STARTED</button>
    </main>

    <section class="menu-section">
    <h2>My Menu</h2>

    <button class="menu-btn">Home</button>
    <button class="menu-btn">About</button>
    <button class="menu-btn">Contact</button>
    <button class="menu-btn">Login</button>
    </section>

    <section class="login-section">
        <h2>Login Form</h2>

        <form method="POST" class="login-form">
            {% csrf_token %}

            <div class="form-row">
                <label for="id_username">Username</label>
                {{ form.username }}
            </div>

            <div class="form-row">
                <label for="id_password">Password</label>
                {{ form.password }}
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

            <p class="message">{{ message }}</p>
        </form>
    </section>
         
</body>
</html>
