<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users Table</title>

    <style>
        body {
            font-family: Arial;
            background: #e5f3f5;
            text-align: center;
        }

        table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #333;
            padding: 12px;
        }

        th {
            background: #0878f9;
            color: white;
        }

        h2 {
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <h2>Users Information</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Age</th>
            <th>City</th>
        </tr>

        {% for user in users %}
        <tr>
            <td>{{ user.0 }}</td>
            <td>{{ user.1 }}</td>
            <td>{{ user.2 }}</td>
            <td>{{ user.3 }}</td>
            <td>{{ user.4 }}</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
