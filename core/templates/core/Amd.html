
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایت من</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, sans-serif;
            direction: rtl;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* نوار بالایی */
        .header {
            height: 38px;
            background-color: #333;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            font-size: 10px;
        }

        .navbar {
            display: flex;
            gap: 18px;
        }

        .header a {
            color: white;
            text-decoration: none;
        }

        /* محتوای صفحه */
        .container {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .main {
            flex: 1;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main h2 {
            font-size: 22px;
            color: #111;
        }

        /* منوی سمت راست */
        .sidebar {
            width: 162px;
            flex-shrink: 0;
            background-color: #ddd;
            padding: 24px 12px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            font-size: 11px;
        }

        .sidebar h3 {
            font-size: 13px;
        }

        .sidebar a {
            color: #444;
            text-decoration: none;
        }

        /* پایین صفحه */
        .footer {
            height: 61px;
            flex-shrink: 0;
            background-color: #333;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
        }

        /* نمایش بهتر در موبایل */
        @media (max-width: 600px) {
            .header {
                padding: 0 8px;
            }

            .navbar {
                gap: 8px;
            }

            .sidebar {
                width: 120px;
            }

            .main h2 {
                font-size: 17px;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <header class="header">

        <div class="logo">
            لوگوی سایت
        </div>

        <nav class="navbar">
            <a href="#">خانه</a>
            <a href="#">محصولات</a>
            <a href="#">درباره ما</a>
            <a href="#">تماس با ما</a>
        </nav>

    </header>

    <div class="container">

        <main class="main">
            <h2>به سایت ما خوش آمدید</h2>
        </main>

        <aside class="sidebar">
            <h3>منوی کناری</h3>
            <a href="#">زیرنویس</a>
            <a href="#">دسته‌بندی‌ها</a>
            <a href="#">تبلیغات</a>
            <a href="#">پیام‌ها</a>
            <a href="#">خروج</a>
        </aside>

    </div>

    <footer class="footer">
        تمامی حقوق محفوظ است.
    </footer>

</body>
</html>
