
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایت من</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, sans-serif;
            direction: rtl;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #f1f1f1;
        }

        /* نوار بالایی */
        .header {
            height: 38px;
            background-color: #333;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            font-size: 10px;
        }

        .navbar {
            display: flex;
            gap: 18px;
            position: sticky;
            top: 0;
            background: #222;
            padding: 20px;
            text-align: center;
            z-index: 100;
        }

        nav a{
            color: white;
            text-decoration: none;
            margin: 15px;
            font-size: 17px;
        }

        nav a:hover{
            color: cyan;
        }

        .main{
            height: 450px;
            background-image: url(https://picsum.photos/1920/1080?random=5);
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            color: white;
            text-shadow: 2px 2px 5px black;
            font-size: 35px;
        }


        .header a {
            color: white;
            text-decoration: none;
        }

        /* محتوای صفحه */
        .container {
            display: flex;
            flex: 1;
            min-height: 0;
            padding: 40px 20px;
            text-align: center;
        }

        .container h2{
            margin-bottom: 30px;
        }

        .main {
            flex: 1;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main h2 {
            font-size: 22px;
            color: #111;
        }

        .cards{
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card{
            width: 300px;
            height: 250px;
            background-size: cover;
            background-position: center;
            border-radius: 15px;
            display: flex;
            align-items: end;
            justify-content: center;
            overflow: hidden;
        }

        .card h3{
            color: cyan;
            background: rgba(red, green, blue, alpha);
            width: 100%;
            padding: 15px;
        }

        .image1{
            background-image: url(https://picsum.photos/1920/1080?random=5);
        }

        .image2{
            background-image: url(https://picsum.photos/1920/1080?random=6);
        }

        .image3{
            background-image: url(https://picsum.photos/1920/1080?random=7);
        }


        /* منوی سمت راست */
        .sidebar {
            width: 162px;
            flex-shrink: 0;
            background-color: #ddd;
            padding: 24px 12px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            font-size: 11px;
        }

        .sidebar h3 {
            font-size: 13px;
        }

        .sidebar a {
            color: #444;
            text-decoration: none;
        }

        /* پایین صفحه */
        .footer {
            height: 61px;
            flex-shrink: 0;
            background-color: #333;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
        }

    
        @media (max-width: 600px) {
            .header {
                padding: 0 8px;
            }

            .navbar {
                gap: 8px;
            }

            .sidebar {
                width: 120px;
            }

            .main h2 {
                font-size: 17px;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <header class="header">

        <div class="logo">
            لوگوی سایت
        </div>

        <nav class="navbar" id="about">
            <a href="#">خانه</a>
            <a href="#">محصولات</a>
            <a href="#">درباره ما</a>
            <a href="#">تماس با ما</a>
        </nav>

    </header>

    <div class="container">

        <main class="main">
            <h2>به سایت ما خوش آمدید</h2>
        </main>

        <aside class="sidebar">
            <h3>منوی کناری</h3>
            <a href="#">زیرنویس</a>
            <a href="#">دسته‌بندی‌ها</a>
            <a href="#">تبلیغات</a>
            <a href="#">پیام‌ها</a>
            <a href="#">خروج</a>
        </aside>

    </div>

    <div class="container-2" id="images">
        <h2>گالری تصاویر</h2>

        <div class="cards">

            <div class="card image1">
                <h3>تصویر اول</h3>
            </div>

            <div class="card image2">
                <h3>تصویر دوم</h3>
            </div>

            <div class="card image3">
                <h3>تصویر سوم</h3>
            </div>
        </div>

    </div>

    <footer class="footer">
        تمامی حقوق محفوظ است.
    </footer>

</body>
</html>
